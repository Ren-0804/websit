name: Publish scheduled Central Asia logistics guide

on:
  schedule:
    - cron: "0 8 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate and validate without publishing
        required: false
        type: boolean
        default: false
      force_publish:
        description: Publish now even when the random interval has not elapsed
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-central-asia-logistics-guide
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test publisher rules
        run: pnpm test:publisher

      - name: Generate scheduled guide
        id: generate
        run: pnpm publish:daily
        env:
          DAILY_POST_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          DAILY_POST_FORCE: ${{ inputs.force_publish && '1' || '0' }}

      - name: Validate production build
        if: ${{ steps.generate.outputs.created == 'true' }}
        run: pnpm check
        env:
          JWT_SECRET: daily-publish-secret-value-at-least-32-characters
          TOTP_SECRET: JBSWY3DPEHPK3PXP
          SMTP_HOST: localhost
          SMTP_PORT: "587"
          SMTP_USER: ci@example.com
          SMTP_PASSWORD: daily-publish-placeholder
          CONTACT_EMAIL: ci@example.com

      - name: Commit published guide
        if: ${{ steps.generate.outputs.created == 'true' }}
        run: |
          if [ -z "$(git status --porcelain -- content/posts content/.daily-logistics-state.json)" ]; then
            echo "No guide was created; nothing to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts content/.daily-logistics-state.json
          git commit -m "content: publish scheduled Central Asia logistics guide"
          git pull --rebase origin main
          git push origin main
