name: Publish daily Central Asia logistics guide

on:
  schedule:
    - cron: "0 8 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate and validate without publishing
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-central-asia-logistics-guide
  cancel-in-progress: false

permissions:
  contents: write
  models: read

jobs:
  publish-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate daily guide
        run: pnpm publish:daily
        env:
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAILY_POST_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}

      - name: Commit published guide
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet -- content/posts; then
            echo "A guide for today already exists; nothing to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts
          git commit -m "content: publish daily Central Asia logistics guide"
          git pull --rebase origin main
          git push origin main
